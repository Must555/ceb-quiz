<!doctype html>
<html lang="fr" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission CEB — Réussis ton CEB en jouant</title>
<meta name="description" content="Entraîne-toi au CEB (Certificat d'Études de Base, Fédération Wallonie-Bruxelles) : questions illimitées, vrais examens, badges et défis.">
<meta name="theme-color" content="#0b0b10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23c6ff3d'/><text x='50' y='68' font-size='58' text-anchor='middle'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Applique l'ambiance du dernier joueur avant l'affichage (évite un flash de couleurs).
  try { const s = JSON.parse(localStorage.getItem('missionceb.v1')); const t = s && s.actif && s.joueurs[s.actif] && s.joueurs[s.actif].theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
  <section class="ecran" id="ecran-connexion"><div style="display:grid;place-items:center;min-height:100vh;font-size:48px">🚀</div></section>
  <section class="ecran" id="ecran-accueil" hidden></section>
  <section class="ecran" id="ecran-quiz" hidden></section>
  <section class="ecran" id="ecran-resultat" hidden></section>
  <section class="ecran" id="ecran-reglages" hidden></section>
  <noscript><p style="padding:24px">Mission CEB a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="js/app/app.js"></script>
</body>
</html>
