# Génère les fichiers audio des textes d'écoute avec Azure Speech.
# Se lance quand scripts/audio/commande.json change sur la branche « audio » ; le résultat est
# enregistré sur cette même branche (rien n'est publié sur le site sans relecture).
name: Audio des textes d'écoute
on:
  push:
    branches: [audio]
    paths: ['scripts/audio/commande.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/audio/generer-audio.mjs 2>&1 | tee scripts/audio/journal.txt; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: Enregistrer les fichiers (et le journal, même en cas d'échec)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in audio-essais assets/audio scripts/audio/journal.txt; do [ -e "$d" ] && git add -A "$d"; done
          git commit -m "Audio généré (Azure Speech)" || echo "Rien de nouveau"
          git push
